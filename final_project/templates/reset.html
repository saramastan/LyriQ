{% extends "all.html" %}

{% block content %}
<main class="register">
  <h2>Reset Password</h2>
  <p>Enter your username or email to receive a password reset link to your inbox:</p>

{% if messages %}
  {% for message in messages %}
    <div class="alert {% if 'success' in message.tags %}alert-success{% elif 'error' in message.tags %}alert-danger{% else %}alert-info{% endif %}" role="alert">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}


  <form method="post" class="mb-2">
    {% csrf_token %} {{ form }}
    <button type="submit" class="btn btn-success btn-sm">Submit Reset Request</button>
  </form>
  <br />
  
  <a class="btn btn-secondary btn-sm" href="{% url 'login' %}">Back to Login</a>
</main>
{% endblock %}
