{% extends "all.html" %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/home.css' %}">
<style>
  /* Light mode placeholder (default) */
  .form-control::placeholder {
    color: #6c757d;
    opacity: 1;
  }

  /* Dark mode placeholder */
  [data-bs-theme="dark"] .form-control::placeholder {
    color: #adb5bd;
    opacity: 1;
  }

  /* Ensure input text is always visible in dark mode */
  [data-bs-theme="dark"] .form-control {
    color: #dee2e6;
    background-color: #212529;
  }
</style>
{% endblock %}

{% block content %}

  <main class="home-page">
    <div class="container">
      <div class="home-shell">
        <section class="home-card">
          <h1 class="home-title">Start a New Game</h1>
          <p class="home-subtitle">Enter an artist to generate a lyric puzzle.</p>

          <!-- Posts to /game where Wireframe 1 is rendered -->
          <form class="home-form" method="post" action="{% url 'game' %}">
            {% csrf_token %}
            <input type="hidden" name="action" value="start_game" />

            <div class="form-field">
              <label for="artist" class="form-label">Artist</label>
              <input
                id="artist"
                name="artist"
                type="text"
                class="form-control"
                placeholder="e.g., Taylor Swift"
                required
                autocomplete="off"
              />
            </div>
            <fieldset class="mt-3">
              <legend class="form-label mb-2 d-block">Difficulty</legend>
            
              <div class="btn-group mb-3" role="group" aria-label="Difficulty">
                <input type="radio" class="btn-check" name="difficulty" id="diff-easy" value="Easy" checked>
                <label class="btn btn-outline-secondary" for="diff-easy">Easy</label>
            
                <input type="radio" class="btn-check" name="difficulty" id="diff-medium" value="Medium">
                <label class="btn btn-outline-secondary" for="diff-medium">Medium</label>
            
                <input type="radio" class="btn-check" name="difficulty" id="diff-hard" value="Hard">
                <label class="btn btn-outline-secondary" for="diff-hard">Hard</label>
            
                <input type="radio" class="btn-check" name="difficulty" id="diff-custom" value="Custom">
                <label class="btn btn-outline-secondary" for="diff-custom">Custom</label>
              </div>
            
              <!-- custom options -->
              <div id="custom-settings" class="border rounded p-3" style="display:none;">
                <div class="row g-3">
                  <div class="col-6 col-md-3">
                    <label for="max_tries" class="form-label">Max Tries</label>
                    <input type="number" id="max_tries" name="max_tries" class="form-control" min="1" max="10" value="10">
                  </div>
                  <div class="col-6 col-md-3">
                    <label for="max_lives" class="form-label">Max Lives</label>
                    <input type="number" id="max_lives" name="max_lives" class="form-control" min="1" max="10" value="3">
                  </div>
                  <div class="col-6 col-md-3">
                    <label for="max_hints" class="form-label">Max Hints</label>
                    <input type="number" id="max_hints" name="max_hints" class="form-control" min="0" max="10" value="3">
                  </div>
                  <div class="col-6 col-md-3">
                    <label for="word_length" class="form-label">Word Length</label>
                    <select id="word_length" name="word_length" class="form-select">
                      <option value="Small">Small</option>
                      <option value="Medium" selected>Medium</option>
                      <option value="Large">Large</option>
                    </select>
                  </div>
                  <div class="col-12 col-md-6">
                    <label for="decoys" class="form-label">Decoy Words</label>
                    <select id="decoys" name="decoys" class="form-select">
                      <option value="None">None</option>
                      <option value="Few" selected>Few</option>
                      <option value="Some">Some</option>
                    </select>
                  </div>
                </div>
              </div>
            </fieldset>

            <div class="home-actions">
                <button type="submit" id="playBtn" class="btn btn-primary">
                    <span class="spinner-border spinner-border-sm me-2 d-none" id="playSpinner"></span>
                    Play
                </button>
            </div>
          </form>

          <!-- Optional helper text -->
          <p class="home-hint">Tip: try a popular artist for better lyric coverage.</p>
        </section>
      </div>
    </div>
  </main>

  <script>
      
      
      document.addEventListener("DOMContentLoaded", () => {
          
          
          
          const playBtn = document.getElementById("playBtn");
          const spinner = document.getElementById("playSpinner");
          
          if (playBtn) {
              playBtn.addEventListener("click", (e) => {
                  
                  const form = playBtn.closest("form");

                      if (!form.checkValidity()) {
                          return;
                      }

                  e.preventDefault();
                  spinner.classList.remove("d-none");
                  playBtn.setAttribute("disabled", true);
                  setTimeout(() => form.submit(), 50);
              });
          }
      });
    const radios = document.querySelectorAll('input[name="difficulty"]');
    const customBox = document.getElementById('custom-settings');
    radios.forEach(r => r.addEventListener('change', () => {
    customBox.style.display = document.getElementById('diff-custom').checked ? 'block' : 'none';
    }));
  </script>
{% endblock %}
